# =============================================================================
# deploy-development.yml — SpikeSignals Development CI/CD Pipeline
#
# Trigger: every push to the `development` branch
#
# Flow:
#   test ──► build ──► register ──► migrate ──► deploy ──► smoke-test
#
#   Each stage is its own job. A failure at any stage stops the pipeline.
#   The ECS service is never touched if test, build, register, or migrate fail.
#
# Required GitHub Secrets:
#   DEV_DEPLOY_ROLE_ARN   — IAM role ARN assumed via OIDC for dev deploys
#   ECR_REGISTRY          — ECR registry hostname (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com)
#   ECS_CLUSTER_DEV       — ECS cluster name for development
#   ECS_SERVICE_DEV       — ECS service name for development
#   ECS_TASK_DEF_DEV      — ECS task definition family name (no revision suffix)
#   ECS_NETWORK_CONFIG    — JSON for --network-configuration (subnets + security groups)
#   DEV_URL               — Base URL for dev smoke test (no trailing slash)
# =============================================================================

name: CI/CD — Development

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CONTAINER_NAME: spikesignals-api
  IMAGE_REPO: spikesignals-api
  PYTHON_VERSION: "3.12"

# =============================================================================
# JOB 1 — Tests & Static Checks
# Runs without AWS credentials. Fails fast before any deploy work begins.
# =============================================================================
jobs:
  test:
    name: Tests & Static Checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-secret-key-placeholder"
      POSTHOG_ENABLED: "false"
      DJANGO_SETTINGS_MODULE: "SpikeSignals.settings_test"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Locked to 3.12 — channels 3.0.5 imports `cgi` removed in Python 3.13
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Inject Sandboxed local_settings.py
        run: |
          cat << 'EOF' > SpikeSignals/local_settings.py
          # CI sandboxed override — replaces all external service connections
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.sqlite3',
                  'NAME': ':memory:',
              }
          }
          CHANNEL_LAYERS = {
              "default": {
                  "BACKEND": "channels.layers.InMemoryChannelLayer",
              },
          }
          CACHES = {
              "default": {
                  "BACKEND": "django.core.cache.backends.dummy.DummyCache",
              }
          }
          EMAIL_BACKEND = 'django.core.mail.backends.locmem.EmailBackend'
          SECURE_SSL_REDIRECT = False
          SESSION_COOKIE_SECURE = False
          CSRF_COOKIE_SECURE = False
          POSTHOG_ENABLED = False
          TELECOM_ENFORCEMENT_ENABLED = False
          TELECOM_DISPATCH_ENABLED = False
          FCM_ENABLED = False
          VOICE_ENABLED = False
          WHATSAPP_ENABLED = False
          SIGNALS_V1_API_ENABLED = False
          EOF
          echo " Sandboxed local_settings.py generated"

      - name: Verify Python Syntax
        run: |
          echo " Checking Python syntax across all source files..."
          python -m compileall SpikeSignals SpikeSignals_app
          echo " Syntax check passed"

      - name: Run Django System Checks
        run: |
          echo " Running Django system checks..."
          python manage.py check
          echo " Django system checks passed"

      - name: Check for Missing Migrations
        run: |
          echo " Checking for unapplied model changes..."
          python manage.py makemigrations --check --dry-run
          echo " No missing migrations detected"

      - name: Run Test Suite
        run: |
          echo " Running pytest..."
          pytest -q
          echo " All tests passed"

# =============================================================================
# JOB 2 — Build & Push Docker Image
# Builds Dockerfile.api and pushes two tags to ECR.
# Outputs the immutable SHA-tagged image URI for downstream jobs.
# =============================================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          IMAGE_URI_SHA: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
          IMAGE_URI_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:dev-latest
        run: |
          echo " Building Docker image from Dockerfile.api..."
          docker build -f Dockerfile.api \
            -t "$IMAGE_URI_SHA" \
            -t "$IMAGE_URI_LATEST" \
            .
          echo " Image built"

      - name: Push Image Tags to ECR
        id: push
        env:
          IMAGE_URI_SHA: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
          IMAGE_URI_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:dev-latest
        run: |
          echo " Pushing $IMAGE_URI_SHA..."
          docker push "$IMAGE_URI_SHA"
          echo " Pushing $IMAGE_URI_LATEST..."
          docker push "$IMAGE_URI_LATEST"
          echo " Both tags pushed to ECR"
          echo "image_uri=$IMAGE_URI_SHA" >> "$GITHUB_OUTPUT"

# =============================================================================
# JOB 3 — Register New ECS Task Definition
# Fetches the current task definition, swaps the container image to the new
# SHA-tagged URI, strips read-only fields, and registers a new revision.
# Outputs the new task definition ARN for downstream jobs.
# =============================================================================
  register:
    name: Register Task Definition
    runs-on: ubuntu-latest
    needs: build
    outputs:
      task_def_arn: ${{ steps.register.outputs.task_def_arn }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Current Task Definition
        id: fetch
        run: |
          echo " Fetching task definition: ${{ secrets.ECS_TASK_DEF_DEV }}"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_DEF_DEV }}" \
            --query taskDefinition \
            --output json)
          # Write to file to avoid shell escaping issues with large JSON
          echo "$TASK_DEF" > task_def.json
          echo " Task definition fetched"

      - name: Swap Container Image
        run: |
          echo " Swapping image to ${{ needs.build.outputs.image_uri }}..."
          jq \
            --arg IMAGE "${{ needs.build.outputs.image_uri }}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy)' \
            task_def.json > new_task_def.json
          echo " Image swapped"

      - name: Register Updated Task Definition
        id: register
        run: |
          echo " Registering new task definition revision..."
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new_task_def.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo " Registered: $NEW_TASK_DEF_ARN"
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

# =============================================================================
# JOB 4 — Run Django Migrations
# Launches a one-off Fargate task using the new task definition.
# Waits for it to stop and checks the exit code.
# The ECS service is NOT updated if this job fails.
# =============================================================================
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: register

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Launch Migration Task
        id: launch
        run: |
          echo " Launching one-off Fargate task for migrations..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ secrets.ECS_CLUSTER_DEV }}" \
            --task-definition "${{ needs.register.outputs.task_def_arn }}" \
            --launch-type FARGATE \
            --network-configuration '${{ secrets.ECS_NETWORK_CONFIG }}' \
            --overrides "{\"containerOverrides\":[{\"name\":\"${{ env.CONTAINER_NAME }}\",\"command\":[\"python\",\"manage.py\",\"migrate\",\"--noinput\"]}]}" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo " Task launched: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for Migration Task to Complete
        run: |
          echo " Waiting for migration task to stop..."
          aws ecs wait tasks-stopped \
            --cluster "${{ secrets.ECS_CLUSTER_DEV }}" \
            --tasks "${{ steps.launch.outputs.task_arn }}"
          echo " Migration task stopped"

      - name: Check Migration Exit Code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ secrets.ECS_CLUSTER_DEV }}" \
            --tasks "${{ steps.launch.outputs.task_arn }}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: Migrations failed with exit code $EXIT_CODE — deploy aborted."
            echo "Check CloudWatch logs for task: ${{ steps.launch.outputs.task_arn }}"
            exit 1
          fi

          echo " Migrations completed successfully (exit code 0)"

# =============================================================================
# JOB 5 — Deploy to ECS
# Updates the ECS service to use the new task definition revision
# and waits for the service to reach a stable state.
# =============================================================================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        run: |
          echo " Updating ECS service: ${{ secrets.ECS_SERVICE_DEV }}"
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER_DEV }}" \
            --service "${{ secrets.ECS_SERVICE_DEV }}" \
            --task-definition "${{ needs.register.outputs.task_def_arn }}" \
            --force-new-deployment \
            --output json > /dev/null
          echo " ECS service update triggered"

      - name: Wait for Service to Stabilise
        run: |
          echo " Waiting for service to reach steady state..."
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER_DEV }}" \
            --services "${{ secrets.ECS_SERVICE_DEV }}"
          echo " ECS service is stable"

# =============================================================================
# JOB 6 — Smoke Test
# Hits the /health/ endpoint up to 5 times with 10 second gaps.
# Fails the pipeline if the service does not respond with HTTP 200.
# =============================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health Check with Retry
        run: |
          HEALTH_URL="${{ secrets.DEV_URL }}/health/"
          echo " Smoke testing $HEALTH_URL (up to 5 attempts)..."

          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo " Smoke test passed on attempt $i (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo " Attempt $i — HTTP $HTTP_STATUS, retrying in 10s..."
            sleep 10
          done

          echo "ERROR: Smoke test failed after 5 attempts — last status: $HTTP_STATUS"
          exit 1

# =============================================================================
# JOB 7 — Deployment Summary
# Always runs regardless of outcome. Writes a summary to the GitHub Actions
# UI showing what was deployed, by whom, and whether it succeeded.
# =============================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build, register, smoke-test]
    if: always()

    steps:
      - name: Write Summary
        run: |
          # Determine overall status from smoke-test result
          if [ "${{ needs.smoke-test.result }}" = "success" ]; then
            STATUS="✅ Success"
          elif [ "${{ needs.smoke-test.result }}" = "skipped" ]; then
            STATUS="⚠️ Skipped (earlier stage failed)"
          else
            STATUS="❌ Failed"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Development Deployment Summary

          | Field              | Value |
          |--------------------|-------|
          | **Environment**    | Development |
          | **Status**         | $STATUS |
          | **Commit SHA**     | \`${{ github.sha }}\` |
          | **Author**         | ${{ github.actor }} |
          | **Image URI**      | \`${{ needs.build.outputs.image_uri }}\` |
          | **Task Definition**| \`${{ needs.register.outputs.task_def_arn }}\` |
          | **Branch**         | \`${{ github.ref_name }}\` |
          EOF
